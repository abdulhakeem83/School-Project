<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>North Public School</title>
    <!--
      GitHub Pages single-page-app redirect.
      Deep links (e.g. /about) hit this 404 page on GitHub Pages; we encode the
      path into the query string and bounce to index.html, which restores it.
      (Technique: rafgraph/spa-github-pages). Ignored by Netlify/Vercel.
    -->
    <script>
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
